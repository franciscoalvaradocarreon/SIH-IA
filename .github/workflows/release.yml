name: Release (imagen en GHCR + WAR)

# Se dispara al crear un tag de version, por ejemplo:
#     git tag -a v0.1.0 -m "Primera publicacion"
#     git push origin v0.1.0
#
# Que produce:
#   1. La imagen Docker en GitHub Container Registry, con el tag y el commit
#      inyectados (por eso GET /api/version deja de decir "dev").
#   2. Un GitHub Release con el WAR ejecutable adjunto, para quien quiera el
#      programa suelto en vez del contenedor.
#   3. El despliegue en el servidor de Oracle, llamando a cd.yml. Publicar un
#      tag es, por tanto, todo el proceso: construir, publicar y desplegar.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# contents: write  -> crear el Release
# packages: write  -> publicar la imagen en GHCR
permissions:
  contents: write
  packages: write

jobs:

  # --------------------------------------------------------------------------
  # Imagen Docker -> GitHub Container Registry
  # --------------------------------------------------------------------------
  imagen:
    name: Imagen en GHCR
    # Runner ARM NATIVO. La VM de Oracle es ARM (aarch64), asi que compilar en un
    # runner x86 obligaba a emular con QEMU: cada instruccion ARM se traduce a x86
    # y recompilar Node + Maven bajo emulacion tardo mas de una hora (el Release
    # de v1.1.0 hubo que cancelarlo). En un runner ARM de verdad no hay emulacion.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Fecha del build (para /api/version)
        id: fecha
        run: echo "valor=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Solo ARM64: es la arquitectura del servidor Y la del runner, asi que
          # se compila de forma nativa y rapida. Para una maquina x86 esta el WAR
          # adjunto al Release, que es la via natural alli.
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Estos tres valores son los que devuelve GET /api/version.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            FECHA_BUILD=${{ steps.fecha.outputs.valor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # WAR ejecutable -> adjunto al Release
  # --------------------------------------------------------------------------
  war:
    name: WAR en el Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FrontendReact/package-lock.json

      - name: Compilar el front
        working-directory: FrontendReact
        run: |
          npm ci
          node node_modules/vite/bin/vite.js build

      - name: Meter el front dentro del WAR
        run: |
          rm -rf BackendJava/src/main/resources/static
          mkdir -p BackendJava/src/main/resources/static
          cp -r FrontendReact/dist/. BackendJava/src/main/resources/static/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Construir el WAR
        working-directory: BackendJava
        run: mvn -B clean package -DskipTests

      - name: Publicar el Release con el WAR
        uses: softprops/action-gh-release@v2
        with:
          files: BackendJava/target/SIH-IA-1.0.war
          generate_release_notes: true
          name: SIH-IA ${{ github.ref_name }}

  # --------------------------------------------------------------------------
  # Despliegue en el servidor de Oracle
  # --------------------------------------------------------------------------
  desplegar:
    name: Desplegar en Oracle
    # La imagen tiene que existir antes de ir a buscarla al servidor. Con
    # 'needs', GitHub no lanza este trabajo hasta que 'imagen' termino BIEN: si
    # el build falla, no se despliega nada. El trabajo del WAR es independiente,
    # asi que esto corre en paralelo con el.
    needs: imagen
    # Solo al publicar un tag. Un 'workflow_dispatch' de este workflow no es un
    # despliegue, y ademas su github.ref seria 'refs/heads/main', con lo que la
    # comprobacion final de version no tendria sentido.
    if: startsWith(github.ref, 'refs/tags/v')
    # 'uses' en lugar de 'steps': llama al workflow reutilizable. Asi la logica
    # del despliegue (SSH, pull, reinicio, verificacion) vive en un solo sitio y
    # se puede lanzar a mano desde la pestana Actions.
    uses: ./.github/workflows/cd.yml
    with:
      version: ${{ github.ref_name }}
    # Los secretos (SSH_KEY, SSH_HOST, SSH_USER) pasan al workflow llamado.
    secrets: inherit
