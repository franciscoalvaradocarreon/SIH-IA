name: CD (desplegar en el servidor)

# Este workflow tiene DOS entradas, y ninguna consiste en "escuchar" a otro
# workflow:
#
#   1. workflow_call  -> lo llama release.yml cuando la imagen ya esta en GHCR.
#      Al ser una llamada directa, GitHub NO lanza este trabajo hasta que el
#      trabajo 'imagen' del Release ha terminado BIEN. Esa es la garantia de
#      orden por construccion.
#
#      Antes esto se intentaba con el disparador 'workflow_run' y NUNCA llego a
#      dispararse: los cuatro despliegues registrados en el repositorio se
#      lanzaron a mano. Por eso v1.1.1 se construyo y se publico en GHCR, pero
#      produccion se quedo en v1.0.1. Un mecanismo que no se puede verificar no
#      sirve como garantia; una llamada explicita si.
#
#   2. workflow_dispatch -> a mano desde la pestana Actions. Sirve para
#      redesplegar lo ultimo publicado (por ejemplo despues de un rollback) o
#      para comprobar que el servicio responde sin publicar nada nuevo.
#
# Que hace en los dos casos: entra por SSH, trae la imagen de GHCR y reinicia
# SOLO la aplicacion. La base de datos y las fotos de los maestros no se tocan.

on:
  workflow_call:
    inputs:
      version:
        description: "Tag que debe quedar en produccion (ej. v1.1.1). Vacio = solo comprobar que el servicio responde."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Tag que debe quedar en produccion (ej. v1.1.1). Vacio = solo comprobar que el servicio responde."
        required: false
        type: string
        default: ""

jobs:
  desplegar:
    name: Desplegar en Oracle
    runs-on: ubuntu-latest
    steps:

      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # printf (no echo) para garantizar el salto de linea final que OpenSSH
          # exige en una clave privada; sin el, la clave se rechaza.
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Verificar que la clave es valida
        run: |
          # ssh-keygen -y extrae la clave publica, asi que falla si la privada esta
          # corrupta o le faltan las lineas BEGIN/END. Sin este paso, un secreto mal
          # pegado se manifiesta mas tarde como un "Permission denied" que despista.
          if ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "Clave privada valida. Su huella es:"
            ssh-keygen -lf ~/.ssh/id_ed25519
          else
            echo "::error::El secreto SSH_KEY no contiene una clave privada valida. Debe incluir las lineas -----BEGIN ... KEY----- y -----END ... KEY----- y sus saltos de linea."
            exit 1
          fi

      - name: Desplegar y verificar la version
        env:
          HOST: ${{ secrets.SSH_HOST }}
          # Se llama USUARIO y no USER a proposito: USER es una variable del
          # sistema en Linux y reutilizar ese nombre es pedir interferencias.
          USUARIO: ${{ secrets.SSH_USER }}
          # El tag publicado (por ejemplo v1.1.1), que llega como parametro:
          # del Release cuando llama a este workflow, o del formulario cuando se
          # lanza a mano. Vacio = basta con que el servicio responda.
          ESPERADA: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Se usa una FUNCION y no una variable con el comando completo: una
          # variable se expande por palabras, asi que un espacio o un salto de
          # linea invisible al final de un secreto parte los argumentos y ssh
          # falla con "unknown option -- -". Con una funcion, cada argumento va
          # entre comillas y no hay sorpresas.
          ssh_sih() {
            ssh -i "$HOME/.ssh/id_ed25519" \
                -o StrictHostKeyChecking=accept-new \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o ConnectTimeout=20 \
                "$USUARIO@$HOST" "$@"
          }

          echo "=== 0) Revisar los secretos ==="
          for nombre in HOST USUARIO; do
            valor="${!nombre}"
            printf '  %s: %s caracteres' "$nombre" "${#valor}"
            case "$valor" in
              *[[:space:]]*) printf '  <-- AVISO: contiene espacios o saltos de linea\n' ;;
              *) printf '\n' ;;
            esac
          done
          if [ -z "$HOST" ] || [ -z "$USUARIO" ]; then
            echo "::error::Faltan los secretos SSH_HOST o SSH_USER."
            exit 1
          fi

          echo "=== 1) Actualizar el repositorio y traer la imagen ==="
          ssh_sih "cd ~/SIH-IA && git pull && docker compose pull app"

          echo "=== 2) Reiniciar SOLO la aplicacion (la base y los uploads no se tocan) ==="
          ssh_sih "cd ~/SIH-IA && docker compose up -d --no-build app"

          echo "=== 3) Verificar que responde la version publicada ==="
          # La aplicacion tarda ~20 s en arrancar: se reintenta hasta 2 minutos.
          for intento in $(seq 1 12); do
            sleep 10
            VERSION="$(ssh_sih 'curl -s http://127.0.0.1/api/version' || true)"
            echo "  intento $intento: $VERSION"

            if [ -z "$ESPERADA" ]; then
              # Sin version esperada: basta con que el servicio este sano.
              echo "$VERSION" | grep -q '"estado":"ok"' && { echo "OK: el servicio responde"; exit 0; }
            else
              # Despliegue por tag: la version en produccion debe ser la publicada.
              echo "$VERSION" | grep -q "\"version\":\"$ESPERADA\"" && { echo "OK: $ESPERADA esta en produccion"; exit 0; }
            fi
          done

          echo "::error::La version desplegada no coincide con '$ESPERADA' tras 2 minutos."
          echo "--- estado de los contenedores ---"
          ssh_sih "cd ~/SIH-IA && docker compose ps" || true
          echo "--- ultimas lineas del log de la aplicacion ---"
          ssh_sih "cd ~/SIH-IA && docker compose logs app --tail 30" || true
          exit 1

      - name: Resumen
        if: always()
        run: |
          echo "### Despliegue" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version esperada: \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Estado: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
