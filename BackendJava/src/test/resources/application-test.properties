# ============================================================================
# Propiedades para las PRUEBAS
# ============================================================================
# El datasource NO se define aqui: lo inyecta Testcontainers con
# @ServiceConnection apuntando al PostgreSQL 17 que levanta la prueba.
#
# Las variables que application.properties espera como entorno se definen aqui
# para que las pruebas no dependan de nada externo: ni del .env, ni de los
# secretos del CI, ni de variables en la maquina de quien las ejecuta.
# ============================================================================

JWT_SECRETO=clave-solo-para-pruebas-con-mas-de-32-caracteres-de-longitud
DB_PASSWORD=pruebas
MAIL_HOST=localhost
MAIL_USERNAME=pruebas@local
MAIL_PASSWORD=pruebas

# La documentacion de la API se comporta como en produccion: cerrada.
app.api-docs.publica=false

# Menos ruido en la salida de las pruebas.
logging.level.root=WARN
logging.level.mx.sih=INFO
logging.level.org.hibernate=WARN
spring.jpa.show-sql=false
