# ============================================================
# PERFIL DE PRODUCCION (programa -jar en la escuela)
# ============================================================
# Se activa con SPRING_PROFILES_ACTIVE=prod (lo pone iniciar.bat).
# Los SECRETOS siguen viniendo de variables de entorno; aqui solo van los valores propios del
# despliegue en el plantel.

# Uploads: carpeta junto al programa (persistente y respaldable)
app.upload.dir=${UPLOAD_DIR:uploads/maestros/}

# El front se sirve del mismo programa (classpath:/static), asi que el CORS casi no se usa; se deja
# por si algun dia se abre el front desde otro origen.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080}

# Documentacion de la API APAGADA en produccion.
# OJO: 'springdoc.scalar-ui.enabled' NO existe (no aparece en el metadata de
# configuracion de springdoc) y el starter de Scalar sirve /scalar igualmente,
# asi que el cierre real lo hace SeguridadConfiguracion con esta propiedad:
springdoc.api-docs.enabled=false
app.api-docs.publica=false

# Menos ruido en el log del plantel (ajustar a DEBUG solo para diagnosticar)
logging.level.root=INFO
logging.level.mx.sih=INFO

# Nombre de la aplicacion en los logs
spring.application.name=SIH-IA

# ============================================================
# PROXY INVERSO (Caddy)
# ============================================================
# La aplicacion NO publica puertos al exterior: quien ve Internet es Caddy.
# Sin esta linea, getRemoteAddr() devolveria SIEMPRE la IP del contenedor de
# Caddy, y el limitador de intentos de login contaria a todos los usuarios como
# una sola IP: unos pocos fallos de cualquiera bloquearian el acceso a todos.
#
# Es seguro precisamente porque la aplicacion no es alcanzable directamente, asi
# que solo Caddy puede enviar X-Forwarded-For. Si algun dia se expone el puerto
# 8080 al exterior, HAY QUE QUITAR ESTA LINEA: permitiria falsificar la IP y
# saltarse el limitador de intentos.
server.forward-headers-strategy=framework
