spring.application.name=sih-ia

# ============================================================
# SECRETOS: NUNCA en el repositorio. Se inyectan por entorno.
#   Windows (PowerShell):  $env:JWT_SECRETO = "..."  ;  $env:DB_PASSWORD = "..."
#   Linux/Docker:          export JWT_SECRETO=...    ;  export DB_PASSWORD=...
# Generar uno nuevo (>= 32 bytes):  openssl rand -base64 48
# ADVERTENCIA: el valor anterior ya esta publicado en GitHub y debe considerarse
# comprometido. Al cambiarlo, todos los tokens emitidos quedan invalidados.
# ============================================================
jwt.secreto=${JWT_SECRETO}

# ============================================================
# BASE DE DATOS
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SIH?currentSchema=sih}
spring.datasource.username=${DB_USER:User_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.properties.hibernate.default_schema=SIH
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Cuando el esquema este versionado con Flyway, descomentar la linea siguiente:
# spring.jpa.hibernate.ddl-auto=validate

# ============================================================
# LOGS: en produccion NUNCA show-sql ni BasicBinder=TRACE
# (imprimian correos, telefonos y hashes de contrasena en los logs)
# ============================================================
spring.jpa.show-sql=false
spring.jpa.format-sql=false
logging.level.root=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.stat=WARN
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=[%thread] %-5level: %logger - %msg%n

# ============================================================
# CORS: origenes EXACTOS, uno por entorno (sin comodines)
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.allow-credentials=false

# ============================================================
# DOCUMENTACION DE LA API (desactivar en produccion)
# ============================================================
springdoc.scalar-ui.path=/scalar
springdoc.api-docs.path=/v3/api-docs
# springdoc.api-docs.enabled=false
# springdoc.scalar-ui.enabled=false

# Quien decide de verdad si /scalar y /v3/api-docs son accesibles es
# SeguridadConfiguracion (propiedad app.api-docs.publica), NO las claves de
# springdoc: se comprobo en el contenedor que con el perfil de produccion
# activo /scalar seguia respondiendo 200, porque el starter de Scalar sirve su
# interfaz por defecto. Aqui (perfil de desarrollo) se deja abierta.
app.api-docs.publica=true

# ============================================================
# SUBIDA DE ARCHIVOS
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Ruta ABSOLUTA recomendada en produccion (una ruta relativa depende de desde
# donde se lance el proceso):  app.upload.dir=/var/lib/sih/uploads/maestros/
app.upload.dir=${UPLOAD_DIR:uploads/maestros/}
app.upload.url=/uploads/maestros/

# ============================================================
# ERRORES: no filtrar detalle al cliente
# ============================================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ============================================================
# GENERADOR DE HORARIOS IA (motor propio)
# ============================================================
# Modulo "Horario IA": arma el horario con el motor propio (mx.sih.ia). Hace varios intentos, cada uno
# desde cero, y se queda con el mejor. Cada intento tiene su propio tope de tiempo (no hay un tope
# global: si el usuario ve un resultado que le sirve, pulsa Terminar).
#
# OJO CON EL COSTE: los intentos se lanzan TODOS (no hay corte anticipado) y cada uno gasta hasta
# segundos-por-intento. El reloj de una generacion es, por tanto:
#     ceil(intentos / hilos) * segundos-por-intento
# Con los valores de abajo y 3 hilos: ceil(12/3) * 500 = 2000 s (~33 min). Para acortarlo sin perder
# profundidad de busqueda, la palanca es subir hilos, a costa de dejar el servidor sin nucleo libre.
#
# Las reglas del motor estan en ReglasIA, que documenta de donde sale cada peso.
app.ia.intentos=12
# 500 s por intento: es el presupuesto de BUSQUEDA de cada intento, y manda el reloj (ver max-pasos).
# La busqueda local necesita profundidad: los intentos largos encuentran mejores horarios que muchos
# cortos. La pantalla sigue dejando cambiarlo por generacion.
app.ia.segundos-por-intento=500
# Tope de pasos de la busqueda local, POR INTENTO.
# MEDIDO: 150.000 pasos se agotan en ~5 segundos, asi que con el valor anterior el presupuesto de
# tiempo (segundos-por-intento) NUNCA se aprovechaba: los intentos terminaban por el contador de
# pasos en la vigesima parte del tiempo concedido (de ahi los 25 s de una generacion de 6 intentos
# cuando el presupuesto decia 90 s por intento). A ~30.000 pasos/s, 5.000.000 son ~165 s: mas que
# cualquier presupuesto razonable, asi que ahora manda el reloj. Para volver al comportamiento
# anterior basta bajar este numero.
app.ia.max-pasos=5000000

# Cuantos intentos se calculan EN PARALELO, y por tanto cuantos nucleos usa el motor.
# MEDIDO en el servidor (Oracle, 4 OCPU): durante una generacion `docker stats` marcaba ~100% de
# CPU, es decir UN nucleo, con los otros tres parados. Con 3 hilos los 12 intentos van en 4 tandas de
# 500 s en vez de 12 seguidas: 2000 s en lugar de 6000 s, con el mismo motor y las mismas reglas.
# Se deja un nucleo de los cuatro libre a proposito: asi la interfaz sigue respondiendo mientras se
# genera, PostgreSQL no compite por CPU y el recolector de basura tiene sitio.
# El pool es UNO SOLO y lo comparten todas las escuelas: si tres generan a la vez se reparten los 3
# hilos (una tanda de 1 cada una) y las tres terminan mas o menos juntas, en vez de hacer fila. La
# memoria queda acotada por este numero y no por cuantos usuarios haya a la vez.
# OJO: subirlo por encima de los nucleos reales no acelera nada, solo reparte el mismo tiempo entre
# mas intentos a medias. Con 1 el motor vuelve a comportarse como antes (un intento detras de otro),
# aunque las escuelas seguirian sin hacer fila entre ellas.
app.ia.hilos=3

# Asesor LLM (OPCIONAL). Si app.ia.api-key esta vacio, el motor usa solo su heuristica y no se llama a
# ninguna API externa. Si tiene valor, se le pide al modelo un ORDEN de colocacion de materias (de la
# mas dificil a la mas facil): el motor lo usa como preferencia, pero sigue comprobando TODAS las
# reglas duras por su cuenta, asi que el LLM no puede romper el horario. Compatible con OpenAI,
# Azure OpenAI, Groq, Together, Ollama o cualquier proxy con /chat/completions.
app.ia.api-key=${IA_API_KEY:}
app.ia.url=${IA_URL:https://api.openai.com/v1/chat/completions}
app.ia.modelo=${IA_MODELO:gpt-4o-mini}
app.ia.tiempo-limite-segundos=45

# ============================================================
# EMAIL (produccion: SMTP real)
# ============================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:noreply@tudominio.com}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================================
# LOCAL
# ============================================================
spring.profiles.active=local