spring.application.name=sih-ia

# ============================================================
# SECRETOS: NUNCA en el repositorio. Se inyectan por entorno.
#   Windows (PowerShell):  $env:JWT_SECRETO = "..."  ;  $env:DB_PASSWORD = "..."
#   Linux/Docker:          export JWT_SECRETO=...    ;  export DB_PASSWORD=...
# Generar uno nuevo (>= 32 bytes):  openssl rand -base64 48
# ADVERTENCIA: el valor anterior ya esta publicado en GitHub y debe considerarse
# comprometido. Al cambiarlo, todos los tokens emitidos quedan invalidados.
# ============================================================
jwt.secreto=${JWT_SECRETO}

# ============================================================
# BASE DE DATOS
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SIH?currentSchema=sih}
spring.datasource.username=${DB_USER:User_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.properties.hibernate.default_schema=SIH
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Cuando el esquema este versionado con Flyway, descomentar la linea siguiente:
# spring.jpa.hibernate.ddl-auto=validate

# ============================================================
# LOGS: en produccion NUNCA show-sql ni BasicBinder=TRACE
# (imprimian correos, telefonos y hashes de contrasena en los logs)
# ============================================================
spring.jpa.show-sql=false
spring.jpa.format-sql=false
logging.level.root=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.stat=WARN
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=[%thread] %-5level: %logger - %msg%n

# ============================================================
# CORS: origenes EXACTOS, uno por entorno (sin comodines)
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.allow-credentials=false

# ============================================================
# DOCUMENTACION DE LA API (desactivar en produccion)
# ============================================================
springdoc.scalar-ui.path=/scalar
springdoc.api-docs.path=/v3/api-docs
# springdoc.api-docs.enabled=false
# springdoc.scalar-ui.enabled=false

# Quien decide de verdad si /scalar y /v3/api-docs son accesibles es
# SeguridadConfiguracion (propiedad app.api-docs.publica), NO las claves de
# springdoc: se comprobo en el contenedor que con el perfil de produccion
# activo /scalar seguia respondiendo 200, porque el starter de Scalar sirve su
# interfaz por defecto. Aqui (perfil de desarrollo) se deja abierta.
app.api-docs.publica=true

# ============================================================
# SUBIDA DE ARCHIVOS
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Ruta ABSOLUTA recomendada en produccion (una ruta relativa depende de desde
# donde se lance el proceso):  app.upload.dir=/var/lib/sih/uploads/maestros/
app.upload.dir=${UPLOAD_DIR:uploads/maestros/}
app.upload.url=/uploads/maestros/

# ============================================================
# ERRORES: no filtrar detalle al cliente
# ============================================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ============================================================
# SOLVER
# ============================================================
# --- Generar UN grupo (POST /api/horarios/generar/{grupoId}) ---
# Decenas de variables: respuesta rápida para el usuario.
app.solver.grupo.seconds-spent-limit=30
app.solver.grupo.unimproved-seconds-spent-limit=15

# --- Generar TODOS los grupos del semestre/turno (POST /api/horarios/generar-todos) ---
# Cientos de variables (729 horas medidas en el semestre 11). Más margen.
# Termina antes si pasan los segundos "sin mejora", así que en la práctica no
# siempre consume el máximo.
# 600 s (10 min): el doble de búsqueda. El límite de "sin mejora" sube con él, porque si no la
# corrida se corta en cuanto el mejor score se estanca y el tiempo extra no se aprovecha.
app.solver.masiva.seconds-spent-limit=600
app.solver.masiva.unimproved-seconds-spent-limit=180

# Varias corridas de la generación masiva (best-of-N): N intentos de X segundos, cada uno con
# reinicio y orden de entidades distinto, quedándose con la mejor solución. Con intentos=1 se usa el
# límite único de arriba. 5 x 60 s = los mismos 5 minutos de antes. La interfaz dibuja la barra de
# progreso con el presupuesto total (intentos x segundos).
# OJO (medido el 19/09/2026): partir los 300 s en 5 intentos de 60 s da PEORES resultados que una
# sola corrida de 300 s. Los 5 intentos puntuaron -269, -307, -326, -347 y -317 medium, mientras que
# una corrida única de 300 s llegó a -180/-195. La busqueda local necesita profundidad; repetir solo
# compensa si el presupuesto TOTAL crece (p.ej. 3 x 180 s = 9 min). Con intentos=1 se usa el limite
# unico de arriba, que es la configuracion buena conocida.
app.solver.masiva.intentos=1
app.solver.masiva.segundos-por-intento=60

# --- PALANCA DE PRUEBAS: terminar por PASOS en vez de por reloj ---
# 0 = desactivado (produccion, como hasta ahora: manda el reloj).
#
# Con la terminacion por reloj, dos corridas del MISMO codigo dan horarios distintos, porque el
# numero de pasos que da ese tiempo depende de la maquina y de su carga. Medido en el semestre 11:
# 729 vs 711 clases colocadas y 75 % vs 90 % de distribucion, sin tocar una linea de codigo. Eso
# hace incomparable cualquier antes/despues. Con un limite de pasos > 0, mismo codigo + misma
# semilla + un solo hilo = MISMO horario, y la comparacion vuelve a significar algo.
#
# Referencia para elegir el numero: mirar en el log del solver la linea
#   "Solving ended: ... move count (N) ..."  de una corrida normal, y usar un valor parecido.
app.solver.grupo.step-count-limit=0
app.solver.masiva.step-count-limit=0

# ============================================================
# GENERADOR DE HORARIOS IA (sin Timefold)
# ============================================================
# Modulo "Horario IA": arma el horario con el motor propio (mx.sih.ia) en vez del solver. Hace
# varios intentos, cada uno desde cero, y se queda con el mejor. Cada intento tiene su propio tope
# de tiempo (no hay un tope global: si el usuario ve un resultado que le sirve, pulsa Terminar).
#
# IMPORTANTE sobre el motor propio: no compite con el solver, lo complementa. Las reglas se toman de
# ReglasIA (que a su vez documenta de que constraint del provider sale cada peso), y ademas de las
# duras del solver el motor exige que una sesion entera sea contigua y que una materia no repita dia.
app.ia.intentos=6
# 90 s por intento (antes 60): le da mas ventanas que probar al reacomodo de grupos, que es la fase
# que rescata las sesiones largas ocupadas. Y mas pasos de busqueda local para que el tiempo extra se
# aproveche de verdad (la pantalla sigue dejando cambiarlo por generacion).
app.ia.segundos-por-intento=90
app.ia.max-pasos=150000

# Asesor LLM (OPCIONAL). Si app.ia.api-key esta vacio, el motor usa solo su heuristica y no se llama a
# ninguna API externa. Si tiene valor, se le pide al modelo un ORDEN de colocacion de materias (de la
# mas dificil a la mas facil): el motor lo usa como preferencia, pero sigue comprobando TODAS las
# reglas duras por su cuenta, asi que el LLM no puede romper el horario. Compatible con OpenAI,
# Azure OpenAI, Groq, Together, Ollama o cualquier proxy con /chat/completions.
app.ia.api-key=${IA_API_KEY:}
app.ia.url=${IA_URL:https://api.openai.com/v1/chat/completions}
app.ia.modelo=${IA_MODELO:gpt-4o-mini}
app.ia.tiempo-limite-segundos=45

# ============================================================
# EMAIL (produccion: SMTP real)
# ============================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:noreply@tudominio.com}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================================
# LOCAL
# ============================================================
spring.profiles.active=local