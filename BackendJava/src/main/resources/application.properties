spring.application.name=sih-ia

# ============================================================
# SECRETOS: NUNCA en el repositorio. Se inyectan por entorno.
#   Windows (PowerShell):  $env:JWT_SECRETO = "..."  ;  $env:DB_PASSWORD = "..."
#   Linux/Docker:          export JWT_SECRETO=...    ;  export DB_PASSWORD=...
# Generar uno nuevo (>= 32 bytes):  openssl rand -base64 48
# ADVERTENCIA: el valor anterior ya est\u00c3\u00a1 publicado en GitHub y debe considerarse
# comprometido. Al cambiarlo, todos los tokens emitidos quedan invalidados.
# ============================================================
jwt.secreto=${JWT_SECRETO}

# ============================================================
# BASE DE DATOS
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SIH?currentSchema=sih}
spring.datasource.username=${DB_USER:User_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.properties.hibernate.default_schema=SIH
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Cuando el esquema est\u00c3\u00a9 versionado con Flyway, descomentar la l\u00c3\u00adnea siguiente:
# spring.jpa.hibernate.ddl-auto=validate

# ============================================================
# LOGS: en produccion NUNCA show-sql ni BasicBinder=TRACE
# (imprim\u00c3\u00adan correos, tel\u00c3\u00a9fonos y hashes de contrasena en los logs)
# ============================================================
spring.jpa.show-sql=false
spring.jpa.format-sql=false
logging.level.root=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.stat=WARN
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=[%thread] %-5level: %logger - %msg%n

# ============================================================
# CORS: or\u00c3\u00adgenes EXACTOS, uno por entorno (sin comodines)
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.allow-credentials=false

# ============================================================
# DOCUMENTACI\u00c3\u0093N DE LA API (desactivar en producci\u00c3\u00b3n)
# ============================================================
springdoc.scalar-ui.path=/scalar
springdoc.api-docs.path=/v3/api-docs
# springdoc.api-docs.enabled=false
# springdoc.scalar-ui.enabled=false

# ============================================================
# SUBIDA DE ARCHIVOS
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Ruta ABSOLUTA recomendada en producci\u00c3\u00b3n (una ruta relativa depende de desde
# d\u00c3\u00b3nde se lance el proceso):  app.upload.dir=/var/lib/sih/uploads/maestros/
app.upload.dir=${UPLOAD_DIR:uploads/maestros/}
app.upload.url=/uploads/maestros/

# ============================================================
# ERRORES: no filtrar detalle al cliente
# ============================================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ============================================================
# SOLVER
# ============================================================
app.solver.seconds-spent-limit=180
app.solver.unimproved-seconds-spent-limit=30

# ============================================================
# EMAIL (producci\u00f3n: SMTP real)
# ============================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:noreply@tudominio.com}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================================
# LOCAL
# ============================================================
spring.profiles.active=local

